[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corl-evaluation"
version = "0.1.0"
description = "Main and out-of-distribution evaluation for CoRL"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "ray>=2.10",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["evaluation*"]

[tool.pytest.ini_options]
pythonpath = [".", "..", "../AgentDyn/src"]
testpaths = ["tests"]
